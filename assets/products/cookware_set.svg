<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="panGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="redPan" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="70%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="shadow5" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-opacity="0.14" flood-color="#0f172a"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgGrad5)"/>
  <ellipse cx="250" cy="405" rx="180" ry="24" fill="#0f172a" opacity="0.1" filter="blur(8px)"/>
  
  <g filter="url(#shadow5)">
    <!-- Back: Kadhai with glass lid -->
    <path d="M 170 240 Q 250 330 330 240 L 330 220 L 170 220 Z" fill="url(#redPan)"/>
    <!-- Handles -->
    <path d="M 165 225 C 145 220 145 240 165 240 Z" fill="#1e293b"/>
    <path d="M 335 225 C 355 220 355 240 335 240 Z" fill="#1e293b"/>
    <!-- Glass Lid -->
    <ellipse cx="250" cy="220" rx="80" ry="22" fill="#bae6fd" opacity="0.5" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="250" cy="205" r="9" fill="#1e293b"/>
    <circle cx="250" cy="205" r="4" fill="#64748b"/>

    <!-- Front Left: Frying Pan -->
    <ellipse cx="190" cy="320" rx="90" ry="35" fill="url(#panGrad)"/>
    <ellipse cx="190" cy="318" rx="82" ry="30" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5"/>
    <ellipse cx="190" cy="318" rx="72" ry="24" fill="#0f172a"/>
    <!-- Handle -->
    <path d="M 100 320 L 40 335 C 30 337 32 345 42 344 L 105 328 Z" fill="#1e293b"/>
    <circle cx="48" cy="340" r="3" fill="#ffffff" opacity="0.6"/>

    <!-- Front Right: Dosa Tawa -->
    <ellipse cx="320" cy="340" rx="95" ry="30" fill="url(#panGrad)"/>
    <ellipse cx="320" cy="338" rx="88" ry="26" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
    <!-- Handle -->
    <path d="M 405 342 L 470 358 C 478 360 476 368 466 367 L 400 348 Z" fill="#1e293b"/>
    <circle cx="462" cy="363" r="3" fill="#ffffff" opacity="0.6"/>
  </g>
  <text x="250" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#64748b" text-anchor="middle">3-Piece Non-Stick Granite Cookware Set</text>
</svg>
