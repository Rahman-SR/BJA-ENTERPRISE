<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="80%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow6" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-opacity="0.14" flood-color="#0f172a"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgGrad6)"/>
  <ellipse cx="250" cy="410" rx="140" ry="20" fill="#0f172a" opacity="0.12" filter="blur(8px)"/>
  
  <g filter="url(#shadow6)">
    <!-- Base Plate -->
    <ellipse cx="250" cy="385" rx="120" ry="24" fill="url(#brassGrad)"/>
    <ellipse cx="250" cy="382" rx="105" ry="18" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>
    
    <!-- Central Pillar / Stem -->
    <path d="M 235 380 L 235 240 Q 240 230 250 230 Q 260 230 265 240 L 265 380 Z" fill="url(#brassGrad)"/>
    <!-- Stem Rings / Details -->
    <ellipse cx="250" cy="340" rx="25" ry="6" fill="url(#brassGrad)"/>
    <ellipse cx="250" cy="290" rx="28" ry="7" fill="url(#brassGrad)"/>
    
    <!-- Oil Cup (Diya Bowl) -->
    <ellipse cx="250" cy="235" rx="85" ry="22" fill="url(#brassGrad)"/>
    <ellipse cx="250" cy="232" rx="75" ry="16" fill="#854d0e"/>
    <ellipse cx="250" cy="232" rx="70" ry="14" fill="#ca8a04"/>

    <!-- Oil level -->
    <ellipse cx="250" cy="233" rx="65" ry="11" fill="#b45309" opacity="0.7"/>

    <!-- Cotton Wick Base -->
    <path d="M 245 233 Q 250 205 250 195 Q 252 205 255 233 Z" fill="#fffbeb"/>

    <!-- Auspicious Flame -->
    <path d="M 250 120 C 230 160 232 195 250 200 C 268 195 270 160 250 120 Z" fill="url(#flameGrad)" filter="drop-shadow(0 0 12px #f59e0b)"/>
    <path d="M 250 145 C 242 165 242 185 250 190 C 258 185 258 165 250 145 Z" fill="#ffffff" opacity="0.9"/>
  </g>
  <text x="250" y="450" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#64748b" text-anchor="middle">Traditional Brass Pooja Diya Gift Set</text>
</svg>
