<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="battenBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="15%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="lightBeam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-opacity="0.3" flood-color="#38bdf8"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgGrad3)"/>
  
  <!-- Light Glow Field -->
  <polygon points="60,240 440,240 470,410 30,410" fill="url(#lightBeam)"/>
  <ellipse cx="250" cy="400" rx="190" ry="25" fill="#e0f2fe" opacity="0.6" filter="blur(12px)"/>
  
  <!-- LED Batten Tube Light -->
  <g filter="url(#glowFilter)">
    <!-- Mounting Bracket End Caps -->
    <rect x="50" y="215" width="20" height="30" rx="4" fill="#64748b"/>
    <rect x="430" y="215" width="20" height="30" rx="4" fill="#64748b"/>

    <!-- Main Diffuser Body Tube -->
    <rect x="65" y="218" width="370" height="24" rx="12" fill="url(#battenBody)" stroke="#bae6fd" stroke-width="1.5"/>
    <rect x="75" y="222" width="350" height="8" rx="4" fill="#ffffff" opacity="0.9"/>
  </g>
  
  <!-- Cool Day White / 20W Emblem -->
  <circle cx="250" cy="150" r="32" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <path d="M 250 130 L 250 140 M 250 160 L 250 170 M 235 140 L 242 145 M 258 155 L 265 160 M 235 160 L 242 155 M 258 145 L 265 140" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <text x="250" y="154" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">20W</text>
  
  <text x="250" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#64748b" text-anchor="middle">20W Slim LED Batten Tube Light</text>
</svg>
