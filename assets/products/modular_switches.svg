<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="switchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="plateShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-opacity="0.12" flood-color="#0f172a"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgGrad2)"/>
  <ellipse cx="250" cy="410" rx="170" ry="20" fill="#0f172a" opacity="0.08" filter="blur(10px)"/>
  
  <!-- Modular Switch Plate -->
  <g filter="url(#plateShadow)">
    <rect x="90" y="140" width="320" height="220" rx="20" fill="url(#plateGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="100" y="150" width="300" height="200" rx="14" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5"/>
    
    <!-- 3 Switches -->
    <!-- Switch 1 -->
    <rect x="125" y="180" width="45" height="85" rx="6" fill="url(#switchGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="125" y1="222" x2="170" y2="222" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="147" cy="245" r="3" fill="#94a3b8"/>
    <line x1="147" y1="195" x2="147" y2="205" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>

    <!-- Switch 2 -->
    <rect x="185" y="180" width="45" height="85" rx="6" fill="url(#switchGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="185" y1="222" x2="230" y2="222" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="207" cy="245" r="3" fill="#94a3b8"/>

    <!-- Switch 3 (With Indicator LED) -->
    <rect x="245" y="180" width="45" height="85" rx="6" fill="url(#switchGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="245" y1="222" x2="290" y2="222" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="260" y="195" width="15" height="5" rx="2" fill="#ef4444" filter="drop-shadow(0 0 3px #ef4444)"/>
    <circle cx="267" cy="245" r="3" fill="#94a3b8"/>

    <!-- 6A Socket (Right side) -->
    <rect x="308" y="180" width="75" height="85" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Earth Pin -->
    <circle cx="345" cy="205" r="7" fill="#1e293b"/>
    <!-- Live and Neutral Pins with shutters -->
    <rect x="325" y="235" width="10" height="15" rx="2" fill="#1e293b"/>
    <rect x="355" y="235" width="10" height="15" rx="2" fill="#1e293b"/>
    <!-- Child safety shutter detail -->
    <circle cx="345" cy="242" r="3" fill="#cbd5e1"/>
  </g>
  <text x="250" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#64748b" text-anchor="middle">Modular 6A Switches &amp; Socket Pack</text>
</svg>
