<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="metalSole" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="ironBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="ironHandle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-opacity="0.12" flood-color="#0f172a"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  <ellipse cx="250" cy="400" rx="160" ry="24" fill="#0f172a" opacity="0.1" filter="blur(8px)"/>
  
  <!-- Iron Body -->
  <g filter="url(#dropShadow)">
    <!-- Soleplate -->
    <path d="M 120 370 L 380 370 Q 420 370 370 330 L 170 290 Q 120 290 120 370 Z" fill="url(#metalSole)"/>
    <path d="M 115 370 L 390 370 L 380 380 L 125 380 Z" fill="#64748b"/>
    
    <!-- Main Body Chassis -->
    <path d="M 130 360 L 360 360 C 390 350 340 280 280 270 L 160 270 C 130 270 125 320 130 360 Z" fill="url(#ironBody)"/>
    
    <!-- Temperature Dial -->
    <ellipse cx="240" cy="275" rx="35" ry="12" fill="#1e293b"/>
    <ellipse cx="240" cy="273" rx="28" ry="9" fill="#e2e8f0"/>
    <circle cx="240" cy="273" r="4" fill="#ef4444"/>
    
    <!-- Handle Loop -->
    <path d="M 140 280 C 130 200 190 160 270 160 C 340 160 370 200 350 280 C 335 280 330 210 270 210 C 200 210 180 230 170 280 Z" fill="url(#ironHandle)"/>
    <!-- Handle Grip Soft Touch -->
    <path d="M 190 185 C 230 170 300 170 330 195 C 320 205 290 190 230 195 C 205 198 195 200 190 185 Z" fill="#0284c7" opacity="0.9"/>
    
    <!-- Power Cord Bushing & Cable -->
    <path d="M 120 345 Q 90 340 80 320 Q 70 300 90 280" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
    <rect x="110" y="335" width="18" height="20" rx="4" fill="#1e293b"/>
  </g>
  <!-- Indicator Lamp -->
  <circle cx="310" cy="240" r="5" fill="#f59e0b" filter="drop-shadow(0 0 6px #f59e0b)"/>
  <!-- Spec label -->
  <text x="250" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#64748b" text-anchor="middle">1000W Heavy Dry Iron</text>
</svg>
