<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="stripBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow4" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-opacity="0.14" flood-color="#0f172a"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgGrad4)"/>
  <ellipse cx="250" cy="405" rx="190" ry="22" fill="#0f172a" opacity="0.09" filter="blur(8px)"/>
  
  <g filter="url(#shadow4)">
    <!-- Cable on Left -->
    <path d="M 60 250 C 40 250 30 220 50 180 C 70 140 100 150 90 220" fill="none" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Main Extension Strip -->
    <rect x="75" y="195" width="360" height="110" rx="16" fill="url(#stripBody)" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Master Switch with Indicator -->
    <rect x="100" y="215" width="40" height="70" rx="6" fill="#dc2626"/>
    <rect x="105" y="222" width="30" height="25" rx="3" fill="#ef4444"/>
    <circle cx="120" cy="270" r="3" fill="#ffffff" opacity="0.8"/>
    
    <!-- 4 Universal Sockets with Individual LED indicators -->
    <!-- Socket 1 -->
    <circle cx="185" cy="250" r="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="185" cy="238" r="4.5" fill="#334155"/>
    <rect x="175" y="254" width="6" height="9" rx="1.5" fill="#334155"/>
    <rect x="189" y="254" width="6" height="9" rx="1.5" fill="#334155"/>
    <circle cx="185" cy="210" r="2.5" fill="#22c55e"/>

    <!-- Socket 2 -->
    <circle cx="250" cy="250" r="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="250" cy="238" r="4.5" fill="#334155"/>
    <rect x="240" y="254" width="6" height="9" rx="1.5" fill="#334155"/>
    <rect x="254" y="254" width="6" height="9" rx="1.5" fill="#334155"/>
    <circle cx="250" cy="210" r="2.5" fill="#22c55e"/>

    <!-- Socket 3 -->
    <circle cx="315" cy="250" r="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="315" cy="238" r="4.5" fill="#334155"/>
    <rect x="305" y="254" width="6" height="9" rx="1.5" fill="#334155"/>
    <rect x="319" y="254" width="6" height="9" rx="1.5" fill="#334155"/>
    <circle cx="315" cy="210" r="2.5" fill="#22c55e"/>

    <!-- Socket 4 -->
    <circle cx="380" cy="250" r="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="380" cy="238" r="4.5" fill="#334155"/>
    <rect x="370" y="254" width="6" height="9" rx="1.5" fill="#334155"/>
    <rect x="384" y="254" width="6" height="9" rx="1.5" fill="#334155"/>
    <circle cx="380" cy="210" r="2.5" fill="#22c55e"/>
  </g>
  <text x="250" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#64748b" text-anchor="middle">4-Socket Surge &amp; Spike Protector Board</text>
</svg>
